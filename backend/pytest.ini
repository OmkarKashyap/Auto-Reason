[pytest]
asyncio_mode = strict
; The DB engine (app/db/session.py) is a module-level singleton created on
; whichever event loop first uses it, matching production (one process, one
; loop). Function-scoped test loops (pytest-asyncio's default) would create a
; fresh loop per test while asyncpg connections stay bound to the first one,
; causing "Event loop is closed" errors during pool cleanup. Pinning both the
; fixture and test loop scope to "session" keeps every test on the one loop
; the engine was created on.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
